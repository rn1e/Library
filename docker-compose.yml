services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-1Q2W3e4r+}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  service:
    build:
      context: .
      dockerfile: Library.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Library: "Server=sql,1433;Database=Library;User Id=sa;Password=${MSSQL_SA_PASSWORD:-1Q2W3e4r+};TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Library.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__Library: "http://service:8080"
    ports:
      - "5006:8080"
    depends_on:
      - service
